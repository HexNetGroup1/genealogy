name: shejire
description: "Shejire — генеалогическое приложение для построения семейного дерева."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_fancy_tree_view: ^1.6.0
  graphview: ^1.2.4
  supabase_flutter: ^2.5.4
  file_selector: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.1
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
